<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1024"/>
      <stop offset="55%" stop-color="#2d1327"/>
      <stop offset="100%" stop-color="#3a1220"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c1d6"/>
      <stop offset="60%" stop-color="#c98aa6"/>
      <stop offset="100%" stop-color="#7a3b52" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- text block -->
  <text x="60" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#f5ecf1" font-weight="700">I Trained an AI on Its Own Output</text>
  <text x="60" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#e3a9c1" font-style="italic">— Here's What It Forgot</text>
  <text x="60" y="196" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#c9b8c4" letter-spacing="0.5">MODEL COLLAPSE EXPERIMENT&#160;&#160;·&#160;&#160;UCI RED WINE QUALITY DATASET</text>

  <!-- generation dots motif: Gen0 -> Gen5, drifting/fading to represent forgetting -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d9c3d1">
    <line x1="740" y1="230" x2="1140" y2="230" stroke="url(#lineFade)" stroke-width="2"/>

    <circle cx="760" cy="230" r="9" fill="#f0d9e6"/>
    <text x="760" y="256" text-anchor="middle">Gen 0</text>

    <circle cx="855" cy="228" r="8" fill="#e3b7cf"/>
    <text x="855" y="256" text-anchor="middle">Gen 1</text>

    <circle cx="945" cy="233" r="7.5" fill="#d494b8"/>
    <text x="945" y="256" text-anchor="middle">Gen 2</text>

    <circle cx="1025" cy="222" r="7" fill="#c07aa1" opacity="0.9"/>
    <text x="1025" y="256" text-anchor="middle">Gen 3</text>

    <circle cx="1090" cy="238" r="6" fill="#a5628c" opacity="0.8"/>
    <text x="1090" y="256" text-anchor="middle">Gen 4</text>

    <circle cx="1135" cy="216" r="5" fill="#834a70" opacity="0.65"/>
    <text x="1135" y="256" text-anchor="middle">Gen 5</text>
  </g>

  <text x="740" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a58ea0" letter-spacing="0.5">RECURSIVE SYNTHETIC TRAINING →</text>
</svg>
