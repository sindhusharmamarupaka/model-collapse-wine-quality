<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="480" fill="#150c14"/>

  <text x="500" y="45" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0d9e6">Within-Class Diversity Change: Gen 0 &#8594; Gen 5</text>
  <text x="500" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a58ea0">Isolated from the data-validity clipping effect</text>

  <!-- zero line -->
  <line x1="120" y1="260" x2="880" y2="260" stroke="#4a2c40" stroke-width="1.5"/>
  <text x="100" y="265" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8f7a8a">0%</text>

  <!-- gridlines -->
  <line x1="120" y1="170" x2="880" y2="170" stroke="#2a1a26" stroke-width="1"/>
  <text x="100" y="175" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5a68">+5%</text>
  <line x1="120" y1="350" x2="880" y2="350" stroke="#2a1a26" stroke-width="1"/>
  <text x="100" y="355" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5a68">-5%</text>

  <!-- Low bar: -4.4% (only class with training samples n=50, so scale ~ -4.4/5*90=~79px below zero) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="220" y="260" width="120" height="79" rx="4" fill="#c94f7c"/>
    <text x="280" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#e88bb0">&#8722;4.4%</text>
    <text x="280" y="392" text-anchor="middle" font-size="14" fill="#e6dbe3">Low quality</text>
    <text x="280" y="412" text-anchor="middle" font-size="12" fill="#8f7a8a">n = 50 training samples</text>

    <!-- Medium bar: +3.9% -->
    <rect x="440" y="190" width="120" height="70" rx="4" fill="#4fae7e"/>
    <text x="500" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#7bd6a5">+3.9%</text>
    <text x="500" y="392" text-anchor="middle" font-size="14" fill="#e6dbe3">Medium quality</text>
    <text x="500" y="412" text-anchor="middle" font-size="12" fill="#8f7a8a">n = 890 training samples</text>

    <!-- High bar: +1.5% -->
    <rect x="660" y="233" width="120" height="27" rx="4" fill="#4fae7e"/>
    <text x="720" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#7bd6a5">+1.5%</text>
    <text x="720" y="392" text-anchor="middle" font-size="14" fill="#e6dbe3">High quality</text>
    <text x="720" y="412" text-anchor="middle" font-size="12" fill="#8f7a8a">n = 147 training samples</text>
  </g>

  <text x="500" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a58ea0" font-style="italic">The smallest, most data-poor class was the only one to lose diversity.</text>
</svg>
