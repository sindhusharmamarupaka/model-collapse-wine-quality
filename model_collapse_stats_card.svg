<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241220"/>
      <stop offset="100%" stop-color="#33172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="#150c14"/>

  <!-- 4 stat cards -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="30" y="30" width="270" height="160" rx="14" fill="url(#cardbg)" stroke="#4a2c40" stroke-width="1"/>
    <text x="165" y="100" text-anchor="middle" font-size="40" font-weight="700" fill="#f0d9e6">1,359</text>
    <text x="165" y="130" text-anchor="middle" font-size="14" fill="#c9b8c4">unique real wine records</text>
    <text x="165" y="150" text-anchor="middle" font-size="12" fill="#8f7a8a">(1,599 raw &#8594; 240 duplicates removed)</text>

    <!-- card 2 -->
    <rect x="315" y="30" width="270" height="160" rx="14" fill="url(#cardbg)" stroke="#4a2c40" stroke-width="1"/>
    <text x="450" y="100" text-anchor="middle" font-size="40" font-weight="700" fill="#f0d9e6">5</text>
    <text x="450" y="130" text-anchor="middle" font-size="14" fill="#c9b8c4">recursive synthetic generations</text>
    <text x="450" y="150" text-anchor="middle" font-size="12" fill="#8f7a8a">Gen 1 trained only on Gen 0's output, and so on</text>

    <!-- card 3 -->
    <rect x="600" y="30" width="270" height="160" rx="14" fill="url(#cardbg)" stroke="#4a2c40" stroke-width="1"/>
    <text x="735" y="100" text-anchor="middle" font-size="36" font-weight="700" fill="#f0d9e6">80.5% &#8594; 80.5%</text>
    <text x="735" y="130" text-anchor="middle" font-size="14" fill="#c9b8c4">accuracy, Gen 0 vs Gen 5</text>
    <text x="735" y="150" text-anchor="middle" font-size="12" fill="#8f7a8a">looked stable — the real story was elsewhere</text>

    <!-- card 4 -->
    <rect x="885" y="30" width="285" height="160" rx="14" fill="url(#cardbg)" stroke="#6b3450" stroke-width="1.5"/>
    <text x="1027" y="100" text-anchor="middle" font-size="40" font-weight="700" fill="#e88bb0">&#8722;4.4%</text>
    <text x="1027" y="130" text-anchor="middle" font-size="14" fill="#c9b8c4">diversity loss, Low-quality class</text>
    <text x="1027" y="150" text-anchor="middle" font-size="12" fill="#8f7a8a">the actual finding, isolated from clipping bias</text>
  </g>
</svg>
