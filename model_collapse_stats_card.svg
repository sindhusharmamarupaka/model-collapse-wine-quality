<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241220"/>
      <stop offset="100%" stop-color="#33172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="#150c14"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="20" y="15" width="280" height="120" rx="10" fill="url(#cardbg)" stroke="#4a2c40" stroke-width="1"/>
    <text x="160" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#f0d9e6">1,359</text>
    <text x="160" y="88" text-anchor="middle" font-size="12" fill="#c9b8c4">real wine records</text>
    <text x="160" y="106" text-anchor="middle" font-size="10.5" fill="#8f7a8a">1,599 raw &#8594; duplicates removed</text>

    <rect x="310" y="15" width="280" height="120" rx="10" fill="url(#cardbg)" stroke="#4a2c40" stroke-width="1"/>
    <text x="450" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#f0d9e6">5</text>
    <text x="450" y="88" text-anchor="middle" font-size="12" fill="#c9b8c4">recursive generations</text>
    <text x="450" y="106" text-anchor="middle" font-size="10.5" fill="#8f7a8a">each trained only on the last</text>

    <rect x="600" y="15" width="280" height="120" rx="10" fill="url(#cardbg)" stroke="#4a2c40" stroke-width="1"/>
    <text x="740" y="65" text-anchor="middle" font-size="24" font-weight="700" fill="#f0d9e6">80.5% &#8594; 80.5%</text>
    <text x="740" y="88" text-anchor="middle" font-size="12" fill="#c9b8c4">accuracy, Gen 0 vs Gen 5</text>
    <text x="740" y="106" text-anchor="middle" font-size="10.5" fill="#8f7a8a">looked stable on the surface</text>

    <rect x="890" y="15" width="290" height="120" rx="10" fill="url(#cardbg)" stroke="#6b3450" stroke-width="1.5"/>
    <text x="1035" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#e88bb0">&#8722;4.4%</text>
    <text x="1035" y="88" text-anchor="middle" font-size="12" fill="#c9b8c4">diversity loss, Low class</text>
    <text x="1035" y="106" text-anchor="middle" font-size="10.5" fill="#8f7a8a">the actual, isolated finding</text>
  </g>
</svg>
